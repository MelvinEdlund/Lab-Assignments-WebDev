<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/auth/storage.js" defer></script>
    <script src="js/auth/auth.js" defer></script>
  </head>
  <body>
    <h1>Blackjack</h1>

    <div>
      <h2>Logga in</h2>
      <input type="text" id="loginUsername" placeholder="Användarnamn" />
      <input type="password" id="loginPassword" placeholder="Lösenord" />
      <button id="loginBtn">Logga in</button>
    </div>

    <div>
      <h2>Registrera</h2>
      <input type="text" id="registerUsername" placeholder="Användarnamn" />
      <input type="password" id="registerPassword" placeholder="Lösenord" />
      <button id="registerBtn">Registrera</button>
    </div>
  </body>
</html>
