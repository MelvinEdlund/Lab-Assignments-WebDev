<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack</title>
    <link rel="stylesheet" href="css/style.css" />

    <script src="js/auth/storage.js" defer></script>
    <script src="js/game/deck.js" defer></script>
    <script src="js/game/game.js" defer></script>
  </head>
  <body>
    <h1>Blackjack</h1>

    <!-- TOPPMENY: visas alltid -->
    <header>
      <span>Inloggad som: <strong id="usernameDisplay"></strong></span>
      <br />
      <span>Saldo: <strong id="balanceDisplay"></strong> kr</span>
      <br />
      <button id="logoutBtn">Logga ut</button>
    </header>
    <hr />
    <!-- SPELPLAN -->
    <main>
      <!-- DEALERNS KORT -->
      <section id="dealerSection">
        <h2>Dealer <span id="dealerScore"></span></h2>
        <div id="dealerCards"></div>
      </section>

      <!-- SPELARENS KORT -->
      <section id="playerSection">
        <h2>Du</h2>

        <div class="player-hand-row" id="playerHandRow0">
          <div class="hand-label">Hand <span id="playerScore0"></span></div>
          <div id="playerHand0" class="player-hand"></div>
        </div>

        <div class="player-hand-row hidden" id="playerHandRow1">
          <div class="hand-label">Hand 2 <span id="playerScore1"></span></div>
          <div id="playerHand1" class="player-hand"></div>
        </div>
      </section>

      <!-- SPELMEDDELANDE: "Du vann!" / "Bust!" etc -->
      <div id="gameMessage"></div>

      <!-- INSATS & STARTA -->
      <div id="betArea">
        <input type="number" id="betAmount" placeholder="Insats i kr" min="1" />
        <button id="startBtn">Satsa & Starta</button>
      </div>

      <!-- HIT & STAND — dolda från start -->
      <div id="actionButtons" style="display: none">
        <button id="doubleBtn">Double</button>
        <button id="hitBtn">Hit</button>
        <button id="standBtn">Stand</button>

        <button id="splitBtn">Split</button>
      </div>

      <!-- SPELA IGEN — dold från start -->
      <button id="playAgainBtn" style="display: none">Spela igen</button>
    </main>
  </body>
</html>
